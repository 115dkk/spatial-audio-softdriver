[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/115dkk/spatial-audio-softreceiver"
publish = false

# Every crate opts in with `[lints] workspace = true`. ssr-sys is the one crate
# with handwritten `unsafe` (ADR 0002) and carries its own table instead, since
# a workspace-level `forbid` cannot be relaxed per module.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[workspace.dependencies]
ssr-types = { path = "crates/ssr-types" }
ssr-abi = { path = "crates/ssr-abi" }
bitstream = { path = "crates/bitstream" }
decode = { path = "crates/decode" }
render = { path = "crates/render" }
convolver = { path = "crates/convolver" }
brir = { path = "crates/brir" }
speakers = { path = "crates/speakers" }
engine = { path = "crates/engine" }
supervisor = { path = "crates/supervisor" }
ssr-sys = { path = "crates/ssr-sys" }
ssr-setup-sys = { path = "crates/ssr-setup-sys" }

windows = { version = "0.62", features = [
    "Wdk_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
wasapi = "0.25"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
# TypeScript bindings of the screen contract (ssr-types feature "ts", ADR 0001).
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
toml = "1.1.8"
zerocopy = { version = "0.8.62", features = ["derive"] }
realfft = "3.5.0"
rubato = "5.0.1"
rtrb = "0.4.0"
hound = "3.5.1"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.0"
proptest = "1.12.0"
# default-features off: the default "disable_release" removes the checker from release builds,
# and release-mode tests must check real-time paths too.
assert_no_alloc = { version = "1.1.2", default-features = false }
eac3 = { git = "https://github.com/harletty/harletty-bridge", rev = "639f0f10f5399755578158bfa598dcea6f60577d" }
# The app's shell (ADR 0001). Only apps/spatial-softreceiver uses them, and only
# on Windows; tauri-build runs from its build script.
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-autostart = "2.7.0"

[profile.release]
lto = "thin"
codegen-units = 1

