name: Pinned Rust toolchain
description: >-
  Installs the toolchain rust-toolchain.toml pins, with optional extra targets
  and components, and restores the shared cargo cache when a key is given.
inputs:
  cache-key:
    description: Swatinem/rust-cache shared-key; empty skips the cache (release builds).
    required: false
    default: ''
  cache-workspaces:
    description: Swatinem/rust-cache workspaces, when not the repository root.
    required: false
    default: ''
  targets:
    description: Extra targets, separated by spaces.
    required: false
    default: ''
  components:
    description: Extra components, separated by spaces.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain (rust-toolchain.toml)
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup toolchain install
        if [ -n "$TARGETS" ]; then rustup target add $TARGETS; fi
        if [ -n "$COMPONENTS" ]; then rustup component add $COMPONENTS; fi
        rustup show active-toolchain

    - if: inputs.cache-key != '' && inputs.cache-workspaces == ''
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}

    - if: inputs.cache-key != '' && inputs.cache-workspaces != ''
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.cache-workspaces }}
