name: Probe Windows runner for SAL

# Throwaway probe, never merged: can a GitHub-hosted Windows runner stand in
# for the SpatialAudioLab test PC? The first run found test signing set in the
# boot entry, Secure Boot off, no HVCI, no audio endpoints, and that a job does
# not survive a reboot. This run only reads whether the running kernel has test
# signing on (code integrity flags). It changes nothing on the runner.

on:
  push:
    branches: [probe/windows-runner-sal]

permissions:
  contents: read

jobs:
  code-integrity:
    name: code integrity flags (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Kernel code integrity flags (NtQuerySystemInformation class 103)
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class CodeIntegrity {
            [StructLayout(LayoutKind.Sequential)]
            public struct Info { public uint Length; public uint Options; }
            [DllImport("ntdll.dll")]
            public static extern int NtQuerySystemInformation(int infoClass, ref Info info, int length, out int returned);
            public static uint Options() {
              var info = new Info { Length = 8 };
              int returned;
              int status = NtQuerySystemInformation(103, ref info, 8, out returned);
              if (status != 0) { throw new Exception("NTSTATUS 0x" + status.ToString("x8")); }
              return info.Options;
            }
          }
          "@
          $options = [CodeIntegrity]::Options()
          "CodeIntegrityOptions = 0x{0:x}" -f $options
          "  enabled (0x1):       $([bool]($options -band 0x1))"
          "  test signing (0x2):  $([bool]($options -band 0x2))"
          "  UMCI (0x4):          $([bool]($options -band 0x4))"
          "  debug mode (0x8):    $([bool]($options -band 0x8))"
          "  HVCI KMCI (0x400):   $([bool]($options -band 0x400))"
          "--- WDK on the image"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'km\ntddk.h') } | ForEach-Object Name
