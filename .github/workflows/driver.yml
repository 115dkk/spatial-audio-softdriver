name: Driver

# The kernel driver (driver/, ADR 0027) on every pull request and push to
# master:
#
#   core       driver/core (the ring, READ gate, DMA clock and format checks
#              that call no kernel API) built with clang and gcc under ASan
#              and UBSan, its tests, libFuzzer for two minutes, and the record
#              stream it writes parsed back by bio-abi
#   core-msvc  the same core with MSVC and /fsanitize=address on Windows
#   kcheck     every kernel source compiled by clang in MSVC mode against the
#              WDK headers, x64 and ARM64, plus the clang static analyzer, as
#              a contributor runs it on Linux (tools/kcheck.py)
#   build      MSBuild with the NuGet WDK, Debug and Release for x64 and ARM64
#              (/W4 /WX, code analysis), and InfVerif
#   package    the Release x64 package test-signed (Inf2Cat, signtool) and
#              installed on a windows-2022 runner, whose boot entry has test
#              signing on: driver store, root device node, service and
#              Parameters defaults. The driver loads, the audio stack must
#              build both render endpoints, and tools/ci/driver_flow_check.py
#              plays a tone into each and reads the ring back
#   codeql     the Windows driver CodeQL suites the hardware program requires
#              (must-fix and recommended)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: driver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: driver core (clang, gcc, sanitizers, fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: driver-core

      - name: Build and test with clang and gcc (ASan, UBSan)
        run: |
          set -euo pipefail
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y --no-install-recommends ninja-build libclang-rt-18-dev > /dev/null
          for cc in "clang clang++" "gcc g++"; do
            set -- $cc
            cmake -S driver/core -B "$RUNNER_TEMP/core-$1" -G Ninja \
              -DCMAKE_C_COMPILER="$1" -DCMAKE_CXX_COMPILER="$2" -DBIO_SANITIZE=ON
            cmake --build "$RUNNER_TEMP/core-$1"
            "$RUNNER_TEMP/core-$1/core_tests"
            "$RUNNER_TEMP/core-$1/write_dump" "$RUNNER_TEMP/core-$1/core.biodump"
          done

      - name: The record stream the core writes parses back in bio-abi
        env:
          BIO_DRIVER_CORE_DUMP: ${{ runner.temp }}/core-clang/core.biodump
        run: cargo test --locked -p bio-abi --test driver_core -- --nocapture

      - name: libFuzzer on the ring and READ gate (120 s)
        run: |
          mkdir -p "$RUNNER_TEMP/ring-artifacts"
          "$RUNNER_TEMP/core-clang/ring_fuzz" -max_total_time=120 -print_final_stats=1 \
            -artifact_prefix="$RUNNER_TEMP/ring-artifacts/"

      - name: libFuzzer on the DMA clock against an __int128 reference (120 s)
        run: |
          mkdir -p "$RUNNER_TEMP/ring-artifacts"
          "$RUNNER_TEMP/core-clang/clock_fuzz" -max_total_time=120 -print_final_stats=1 \
            -artifact_prefix="$RUNNER_TEMP/ring-artifacts/clock-"

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ring-fuzz-artifacts
          path: ${{ runner.temp }}/ring-artifacts
          if-no-files-found: ignore
          retention-days: 14

  core-msvc:
    name: driver core (MSVC, ASan)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: driver-core-msvc

      # RelWithDebInfo: CMake's Debug flags carry /RTC1, which MSVC refuses
      # together with /fsanitize=address.
      - name: Build and test with MSVC (/W4 /WX, /fsanitize=address)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $build = Join-Path $env:RUNNER_TEMP 'core-msvc'
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cmake -S driver/core -B `"$build`" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBIO_SANITIZE=ON && cmake --build `"$build`""
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
          # The ASan runtime DLL sits next to the compiler.
          $cl = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && where cl" | Select-Object -First 1
          $env:PATH = "$(Split-Path $cl);$env:PATH"
          & "$build\core_tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "core_tests failed ($LASTEXITCODE)" }
          & "$build\write_dump.exe" "$build\core.biodump"
          if ($LASTEXITCODE -ne 0) { throw "write_dump failed ($LASTEXITCODE)" }
          "BIO_DRIVER_CORE_DUMP=$build\core.biodump" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: The record stream the MSVC build writes parses back in bio-abi
        run: cargo test --locked -p bio-abi --test driver_core -- --nocapture

  kcheck:
    name: kernel sources on Linux (kcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bio-kcheck
          key: kcheck-${{ hashFiles('tools/kcheck.py') }}

      - name: Compile and analyse every kernel source for x64 and ARM64
        run: python3 tools/kcheck.py --analyze

  build:
    name: driver build (${{ matrix.configuration }}, ${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7

      - name: Build with the NuGet WDK, then InfVerif (tools/build-driver.ps1)
        shell: pwsh
        run: ./tools/build-driver.ps1 -Configuration ${{ matrix.configuration }} -Platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: bioatmos-${{ matrix.configuration }}-${{ matrix.platform }}
          path: target/driver/${{ matrix.configuration }}/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  package:
    name: driver package (test-signed install, x64)
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: bioatmos-Release-x64
          path: ${{ runner.temp }}/package

      # The audio services are manual on Server images; endpoints appear only
      # when they run.
      - name: Start the audio services
        shell: pwsh
        run: |
          foreach ($name in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service -Name $name -StartupType Automatic
            Start-Service -Name $name
          }

      - name: Test-sign, stage and install (tools/ci/install-driver-test.ps1)
        id: install
        shell: pwsh
        run: ./tools/ci/install-driver-test.ps1 -Package (Join-Path $env:RUNNER_TEMP 'package')

      - name: What the audio stack made of the driver (tools/ci/audio-diagnostics.ps1)
        if: steps.install.outputs.loaded == 'true'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 10
          ./tools/ci/audio-diagnostics.ps1 -InstanceId 'ROOT\MEDIA\0000'

      # Users get no service restart either: both render endpoints must be
      # active as the device arrives.
      - name: Both render endpoints are active after install (tools/ci/endpoint-states.ps1)
        id: endpoints
        if: steps.install.outputs.loaded == 'true'
        shell: pwsh
        run: ./tools/ci/endpoint-states.ps1 -InstanceId 'ROOT\MEDIA\0000'

      # Diagnosis only, after the check above failed. A restarted endpoint
      # builder enumerates every interface at once, so endpoints that turn
      # active here point at the order in which the interfaces arrived.
      - name: Endpoint states after restarting the endpoint builder
        if: failure() && steps.endpoints.outcome == 'failure'
        shell: pwsh
        run: |
          Restart-Service -Name AudioEndpointBuilder -Force
          Start-Service -Name Audiosrv
          Start-Sleep -Seconds 15
          ./tools/ci/endpoint-states.ps1 -InstanceId 'ROOT\MEDIA\0000'

      - uses: actions/setup-python@v7
        if: steps.install.outputs.loaded == 'true'
        with:
          python-version: '3.13'

      # Both endpoints at once, each with its own tone, read back from the
      # ring: records, byte continuity, DMA rate and content per endpoint.
      - name: Play through both endpoints and read the ring (tools/ci/driver_flow_check.py)
        if: steps.install.outputs.loaded == 'true'
        shell: pwsh
        run: |
          python -m pip install --quiet -r tools/ci/requirements.txt soundcard==0.4.5
          python tools/ci/driver_flow_check.py --summary (Join-Path $env:RUNNER_TEMP 'driver-flow.json')

      - name: The audio stack after the flow check
        if: failure() && steps.install.outputs.loaded == 'true'
        shell: pwsh
        run: ./tools/ci/audio-diagnostics.ps1 -InstanceId 'ROOT\MEDIA\0000'

      - uses: actions/upload-artifact@v7
        if: always() && steps.install.outputs.loaded == 'true'
        with:
          name: driver-flow
          path: ${{ runner.temp }}/driver-flow.json
          if-no-files-found: ignore

  codeql:
    name: CodeQL Windows driver suites
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # The driver suites name microsoft/cpp-queries@0.0.5, which init does
      # not fetch on its own; the runner image caches a CodeQL bundle.
      - name: Fetch the query pack the driver suites depend on
        shell: pwsh
        run: |
          $codeql = Get-ChildItem -Path (Join-Path $env:RUNNER_TOOL_CACHE 'CodeQL') -Recurse -Filter codeql.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if (-not $codeql) { throw 'no CodeQL bundle in the tool cache' }
          & $codeql.FullName pack download microsoft/cpp-queries@0.0.5
          if ($LASTEXITCODE -ne 0) { throw "codeql pack download failed ($LASTEXITCODE)" }

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          # scope/pack@version:path runs one suite from a pack; `queries`
          # takes only local paths and repositories.
          packs: >-
            microsoft/windows-drivers@1.10.0:windows-driver-suites/mustfix.qls,
            microsoft/windows-drivers@1.10.0:windows-driver-suites/recommended.qls

      - name: Build for the database (Release x64)
        shell: pwsh
        run: ./tools/build-driver.ps1 -Configuration Release -Platform x64

      - uses: github/codeql-action/analyze@v4
        with:
          category: windows-driver
