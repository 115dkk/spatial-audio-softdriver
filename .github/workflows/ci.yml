name: CI

# Gates every pull request and every push to master (ADR 0002). The repository
# is public, so Actions minutes are not rationed: every job runs on every
# event, without path filters.
#
#   lint      fmt, clippy -D warnings (also for the x64 and ARM64 Windows
#             targets, so cfg(windows) code is linted from Linux), the
#             bio-policy gates (forbid unsafe, unsafe budget, feature registry,
#             Windows code only in bio-sys), the release gate's unit tests and
#             the CI tools' unit tests
#   test      cargo test on Linux, Windows Server 2022 and 2025 (x64) and
#             Windows 11 (ARM64), debug and release; on x64 Windows also the
#             generated driver header compiled as C89, C11 and C++17
#   replay    the replay fixtures rendered twice (hashes must match) and,
#             on pull requests, against the base commit (reported, not failed)
#   audio     Windows Server 2022 and 2025 with a virtual audio cable
#             (VB-CABLE): the device tests bio-sys keeps #[ignore]d, the live
#             path played into the cable and recorded back against bio-replay's
#             offline render, and soaks (exclusive, shared, under CPU load and
#             under full page heap) that must end without faults, restarts or
#             underruns
#   docs      rustdoc with warnings denied (broken intra-doc links included),
#             for Linux and for the Windows target
#   miri      the pure parsing crates under Miri
#   fuzz      every cargo-fuzz target for two minutes
#   coverage  llvm-cov line coverage, summarised on the run page
#   deny      cargo-deny: advisories, licenses, bans, sources
# The engine and everything below it build without Windows, which is why the
# Linux legs can run the replay tests at all.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy + policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Type-checking needs no linker, so the Windows targets are linted here
      # too; the cfg(windows) modules of bio-sys and bio-live are otherwise
      # compiled on Windows but never linted.
      - name: cargo clippy for Windows x64 and ARM64 (deny warnings)
        run: |
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo clippy --workspace --all-targets --locked --target "$target" -- -D warnings
          done

      - name: Policy gates (crates/bio-policy)
        run: cargo test -p bio-policy --locked -- --nocapture

      - name: Release gate unit tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # BIO_TEST_PWSH runs the tests that compile the tools' inline C# and run
      # their PowerShell logic (endpoint lookup, exclusive-policy verdicts);
      # PowerShell 7 ships on the hosted images.
      - name: CI tool unit tests (tools/ci)
        env:
          BIO_TEST_PWSH: pwsh
        run: |
          python -m pip install --quiet -r tools/ci/requirements.txt
          python -m unittest discover -s tools/ci -p "test_*.py" -v

  test:
    name: cargo test (${{ matrix.os }}, ${{ matrix.profile }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is Server 2025; windows-11-arm is the client OS on
        # ARM64, the only Windows 11 image GitHub hosts.
        os: [ubuntu-latest, windows-latest, windows-2022, windows-11-arm]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    env:
      PROFILE_FLAG: ${{ matrix.profile == 'release' && '--release' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.profile }}

      - name: cargo test --workspace
        shell: bash
        run: cargo test --workspace --all-targets --locked $PROFILE_FLAG

      - name: cargo test --doc
        if: matrix.profile == 'debug'
        run: cargo test --workspace --doc --locked

      - name: Driver header compiles as C89, C11 and C++17 (MSVC)
        if: runner.os == 'Windows' && runner.arch == 'X64' && matrix.profile == 'debug'
        shell: pwsh
        run: ./tools/check-c-header.ps1

  replay:
    name: replay determinism (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: replay

      - name: Generate the fixtures (apps/bio-replay/examples/replay_fixtures.rs)
        shell: bash
        run: cargo run --locked -q -p bio-replay --example replay_fixtures -- "$RUNNER_TEMP/fx"

      - name: Render every dump twice with this commit; the hashes must match
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p bio-replay
          bin=target/release/bio-replay
          fx="$RUNNER_TEMP/fx"
          {
            echo "## Replay output (${{ matrix.os }})"
            echo
            echo "| dump | output_sha256 | blocks |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in pcm71 ddp51; do
            for run in 1 2; do
              "$bin" render "$fx/$d.biodump" --profile "$fx/profile.toml" \
                --out "$RUNNER_TEMP/$d-$run.wav" --report "$RUNNER_TEMP/$d-$run.json"
            done
            a=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-1.json")
            b=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-2.json")
            test "$(jq '.errors | length' "$RUNNER_TEMP/$d-1.json")" = 0
            if [ "$a" != "$b" ]; then echo "::error::$d renders differently on two runs: $a vs $b"; exit 1; fi
            echo "| $d | \`$a\` | $(jq .blocks "$RUNNER_TEMP/$d-1.json") |" >> "$GITHUB_STEP_SUMMARY"
          done

      # Output changes are allowed (a better renderer changes the bytes), so
      # this step reports instead of failing; the summary says which dumps
      # changed against the pull request's base commit.
      - name: Compare with the base commit
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          fx="$RUNNER_TEMP/fx"
          base="$RUNNER_TEMP/base"
          git worktree add --detach "$base" "$BASE_SHA"
          echo >> "$GITHUB_STEP_SUMMARY"
          if ! (cd "$base" && cargo build --release -q -p bio-replay); then
            echo "Base ${BASE_SHA:0:12} does not build bio-replay; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base_bin="$base/target/release/bio-replay"
          if ! "$base_bin" render --help > /dev/null 2>&1; then
            echo "Base ${BASE_SHA:0:12} has no render command; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "| dump | against base ${BASE_SHA:0:12} |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in pcm71 ddp51; do
            head=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-1.json")
            if "$base_bin" render "$fx/$d.biodump" --profile "$fx/profile.toml" \
                --out "$RUNNER_TEMP/$d-base.wav" --report "$RUNNER_TEMP/$d-base.json"; then
              old=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-base.json")
              if [ "$old" = "$head" ]; then verdict="unchanged"; else verdict="**changed** (base \`$old\`)"; fi
            else
              verdict="base could not render it (input or profile format changed)"
            fi
            echo "| $d | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done

  # GitHub's Windows images have no sound device. VB-CABLE gives one render
  # endpoint ("Speakers (VB-Audio Virtual Cable)") whose signal comes back on a
  # capture endpoint ("CABLE Output"), so the live path can be heard by the
  # job itself (ADR 0026).
  audio:
    name: live audio (${{ matrix.os }}, VB-CABLE)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Line tables in the PDBs, so a crash dump's stack names the source.
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audio

      - name: Install a virtual audio cable (tools/ci/install-virtual-cable.ps1)
        shell: pwsh
        run: ./tools/ci/install-virtual-cable.ps1

      # VB-CABLE's exclusive-mode events advance on the system timer, one per
      # 15.6 ms tick whatever the period; a 1 ms tick lets it keep the periods
      # the engine asks for, as hardware does (ADR 0026).
      - name: Crash dumps on; system timer held at 1 ms; MMCSS running (tools/ci/crash-dumps.ps1, timer-resolution.ps1)
        shell: pwsh
        run: |
          ./tools/ci/crash-dumps.ps1 -Folder (Join-Path $env:RUNNER_TEMP 'dumps')
          ./tools/ci/timer-resolution.ps1
          # MMCSS boosts the real-time threads. The Server images leave it
          # stopped (manual start) until the first registration starts it,
          # which lands in the first second of a run; desktops run it already.
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' |
            Select-Object SystemResponsiveness, NetworkThrottlingIndex | Format-List
          Start-Service -Name MMCSS
          $mmcss = Get-Service -Name MMCSS
          Write-Host "MMCSS $($mmcss.Status) ($($mmcss.StartType))"
          if ($mmcss.Status -ne 'Running') { throw "MMCSS is $($mmcss.Status)" }

      - name: Build bio-live and bio-replay; write the fixtures
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p bio-live -p bio-replay
          cargo run --locked --release -q -p bio-replay --example replay_fixtures -- "$RUNNER_TEMP/fx"
          target/release/bio-live.exe devices

      # The exclusive cadence tests run at a 20 ms period, longer than a PCM
      # block; exclusive_cadence_at_each_period prints the rate the sink
      # keeps at 3 to 40 ms (ADR 0026).
      - name: Device tests bio-sys keeps ignored (WASAPI exclusive and shared, MMCSS, SAL absent)
        env:
          BIO_TEST_EXCLUSIVE_PERIOD_MS: "20"
        run: cargo test --locked --release -p bio-sys --test windows -- --ignored --test-threads=1 --nocapture

      # The stages below run even when an earlier one failed, so one CI round
      # reports on all of them; the job still fails.
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          python-version: "3.13"

      - name: Loopback (live output recorded back against the offline render)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r tools/ci/requirements.txt soundcard==0.4.5
          fx="$RUNNER_TEMP/fx"
          {
            echo "## Loopback (${{ matrix.os }})"
            echo
            echo "| dump | mode | windows | matched | resyncs | median | worst | underruns while streaming | restarts | reference at | first sound |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for d in pcm71 ddp51; do
            target/release/bio-replay.exe render "$fx/$d.biodump" --profile "$fx/profile.toml" \
              --out "$RUNNER_TEMP/$d-ref.wav" --report "$RUNNER_TEMP/$d-ref.json"
            # shared-warm keeps the endpoint running with a silent shared
            # stream, as other apps do on a desktop; shared starts it cold.
            for run in exclusive shared shared-warm; do
              mode=${run%-warm}
              warm=()
              if [ "$run" = shared-warm ]; then warm=(--warm); fi
              s="$RUNNER_TEMP/loopback-$d-$run.json"
              python tools/ci/loopback_check.py --bio-live target/release/bio-live.exe \
                --dump "$fx/$d.biodump" --profile "$fx/profile.toml" \
                --reference "$RUNNER_TEMP/$d-ref.wav" --mode "$mode" "${warm[@]}" --period-ms 20 --summary "$s" \
                --report "$RUNNER_TEMP/loopback-$d-$run-report.json" || status=1
              if [ -f "$s" ]; then
                jq -r --arg d "$d" '"| \($d) | \(.mode) | \(.windows) | \(.matched) | \(.resyncs) | \(.median_correlation) | \(.worst_correlation) | \(.underruns_while_streaming) | \(.output_restarts) | \(.offset_s) s | \(.first_sound_s) s |"' "$s" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          exit $status

      # Speaker output (ADR 0030). A profile whose speakers sit exactly at a
      # PCM layout's positions routes source channel k to device channel k,
      # so each channel's own tone must come back on its own channel through
      # the cable, matching the offline render and 40 dB above the others.
      # The layout is the widest of 8, 6, 4 channels both cable ends take in
      # exclusive mode; exit 2 means the cable took none of them.
      - name: Multichannel loopback (speaker profile through VB-CABLE; tools/ci/multichannel_loopback_check.py)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install --quiet -r tools/ci/requirements.txt
          cargo build --locked --release -p bio-sys --example format_probe --example cable_capture || exit 1
          out="$RUNNER_TEMP/multichannel"
          python tools/ci/multichannel_loopback_check.py \
            --format-probe target/release/examples/format_probe.exe \
            --cable-capture target/release/examples/cable_capture.exe \
            --bio-live target/release/bio-live.exe --bio-replay target/release/bio-replay.exe \
            --work "$out" --summary "$out/summary.json"
          status=$?
          {
            echo "## Multichannel loopback (${{ matrix.os }})"
            echo
            if [ -f "$out/summary.json" ]; then
              jq -r '"channels \(.selected_channels), mode \(.mode), passed \(.passed)"' "$out/summary.json"
              jq -r '(.problems // [])[] | "- \(.)"' "$out/summary.json"
              jq -r '.reason // empty' "$out/summary.json"
            else
              echo "no summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 2 ]; then
            echo "::error::VB-CABLE took no 4, 6 or 8-channel layout in exclusive mode on both ends"
          fi
          exit $status

      - name: Soaks (exclusive 5 min, exclusive at 10 ms 2 min, shared 2 min, DD+ 2 min, exclusive under CPU load 2 min, under full page heap 1 min)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP 'fx'
          $live = 'target/release/bio-live.exe'
          Add-Content $env:GITHUB_STEP_SUMMARY "`n## Soaks (${{ matrix.os }})`n"
          Add-Content $env:GITHUB_STEP_SUMMARY '| soak | ran | underruns | restarts | latency p50 / p99 | ring trough | clock | verdict |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | --- | --- | --- | --- | --- | --- | --- |'
          $failed = @()
          $soaks = @(
            @{ Name = 'exclusive'; Minutes = 5; PeriodMs = 20 },
            @{ Name = 'exclusive-10ms'; Minutes = 2; PeriodMs = 10 },
            @{ Name = 'shared'; Minutes = 2; Shared = $true },
            @{ Name = 'ddp-exclusive'; Minutes = 2; Dump = 'ddp51'; PeriodMs = 20 },
            @{ Name = 'cpu-load'; Minutes = 2; CpuLoad = $true; PeriodMs = 20 },
            @{ Name = 'page-heap'; Minutes = 1; PageHeap = $true; PeriodMs = 20 }
          )
          foreach ($s in $soaks) {
            try {
              ./tools/ci/soak.ps1 -BioLive $live -Fixtures $fx @s
            } catch {
              Write-Host "::error::$($_.Exception.Message)"
              $failed += $s.Name
            }
          }
          if ($failed) { throw "failed soaks: $($failed -join ', ')" }

      - name: Start and stop 60 times (exclusive and shared, half under CPU load; tools/ci/restart-stress.ps1)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          ./tools/ci/restart-stress.ps1 -BioLive target/release/bio-live.exe
          -Fixtures (Join-Path $env:RUNNER_TEMP 'fx') -Symbols (Resolve-Path target/release).Path

      - name: Crash stacks (cdb on any dump)
        if: always()
        shell: pwsh
        run: ./tools/ci/crash-dumps.ps1 -Folder (Join-Path $env:RUNNER_TEMP 'dumps') -Report -Symbols (Resolve-Path target/release).Path

      - name: Keep the reports, dumps and symbols
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/loopback-*.json
            ${{ runner.temp }}/multichannel
            ${{ runner.temp }}/soak-*.json
            ${{ runner.temp }}/soak-*.log
            ${{ runner.temp }}/dumps
            target/release/bio_live.pdb
            target/release/bio_replay.pdb
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

      - name: cargo doc for the Windows target (the cfg(windows) modules)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo doc --workspace --no-deps --document-private-items --locked --target x86_64-pc-windows-msvc

  miri:
    name: Miri (parsing crates)
    runs-on: ubuntu-latest
    env:
      # proptest keeps its regression file on disk; Miri isolation would refuse it.
      MIRIFLAGS: -Zmiri-disable-isolation
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      - name: cargo miri test
        run: cargo +nightly miri test --locked -p bio-types -p bio-abi --lib

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: bio-abi
            target: records
          - crate: bio-abi
            target: dump
          - crate: bitstream
            target: deframer
          - crate: decode
            target: pcm
          - crate: decode
            target: ddp
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: crates/${{ matrix.crate }}/fuzz

      - name: cargo fuzz run (120 s)
        working-directory: crates/${{ matrix.crate }}
        # cargo-fuzz from install-action is a static musl build, which would
        # otherwise make musl its default target.
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }}
          --target x86_64-unknown-linux-gnu -- -max_total_time=120

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain with llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Measure
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          {
            echo "## Line coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --all-features check
