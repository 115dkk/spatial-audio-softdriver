[package]
name = "ssr-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The administrator one-shot helper (ADR 0013, ADR 0032). The app runs it
# elevated; it links ssr-setup-sys and never ssr-sys (ssr-policy checks both).
[lints]
workspace = true

[dependencies]
ssr-abi.workspace = true
ssr-i18n = { workspace = true, features = ["clap"] }
ssr-types.workspace = true
clap.workspace = true

[target.'cfg(windows)'.dependencies]
ssr-setup-sys.workspace = true
