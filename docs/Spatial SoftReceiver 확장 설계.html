<script>
const { useState } = React;
// htm passes plain attributes; React wants className and a style object.
function h(type, props, ...children) {
  if (props) {
    const next = { ...props };
    if ('class' in next) { next.className = next.class; delete next.class; }
    if (typeof next.style === 'string') {
      const style = {};
      next.style.split(';').forEach(decl => {
        const i = decl.indexOf(':');
        if (i < 1) return;
        const key = decl.slice(0, i).trim();
        style[key.startsWith('--') ? key : key.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
      });
      next.style = style;
    }
    props = next;
  }
  return React.createElement(type, props, ...children);
}
const html = htm.bind(h);

/* ---------- small drawing helpers ---------- */
function Box({ x, y, w, h, t, s, k = '' }) {
  const ty = s ? y + h / 2 - 2 : y + h / 2 + 4;
  return html`<g class=${'bx ' + k}>
    <rect x=${x} y=${y} width=${w} height=${h} rx="5"/>
    ${t && html`<text class="bt" x=${x + w / 2} y=${ty} text-anchor="middle">${t}</text>`}
    ${s && html`<text class="bs" x=${x + w / 2} y=${y + h / 2 + 11} text-anchor="middle">${s}</text>`}
  </g>`;
}
function Deep({ x, y, w, h, t, rows }) {
  return html`<g class="bx deep">
    <rect x=${x} y=${y} width=${w} height=${h} rx="7"/>
    <text class="bt" x=${x + 14} y=${y + 22}>${t}</text>
    ${rows.map((r, i) => html`<text key=${i} class="inner" x=${x + 14} y=${y + 42 + i * 17}>${'· ' + r}</text>`)}
  </g>`;
}
function Ar({ x1, y1, x2, y2, k = '' }) {
  const m = k === 'bad' ? 'url(#ab)' : k === 'new' ? 'url(#an)' : 'url(#am)';
  return html`<line class=${'ar ' + k} x1=${x1} y1=${y1} x2=${x2} y2=${y2} marker-end=${m}/>`;
}
function T({ x, y, c = 'lab', a = 'middle', children }) {
  return html`<text class=${c} x=${x} y=${y} text-anchor=${a}>${children}</text>`;
}
function Chip({ k, children }) { return html`<span class=${'chip ' + k}>${children}</span>`; }
const KIND = { '있음': 'ok', '일부': 'warn', '흩어짐': 'warn', '측정 후': 'warn', '다름': 'muted', '교훈': 'muted', '해당 없음': 'muted', '없음': 'bad', '비어 있음': 'bad', '새로': 'new', '계획': 'acc' };

/* ---------- data ---------- */
const STAGES = [
  { id: 'ring', name: '기록 링', code: 'ssr-abi · ssr-sys::sal', now: ['일부', 'SAL 개발 어댑터. 러너에서 12채널 PCM을 손실 없이 받았습니다.'], after: ['계획', '우리 드라이버 v1(M3). 엔드포인트 셋(ADR 0028), 기록에 엔드포인트 번호. 동결 점검표를 반영합니다.'] },
  { id: 'deframe', name: 'IEC 61937 해체', code: 'bitstream', now: ['있음', '버스트 종류(Pc)로 MAT와 DD+를 구분합니다.'], after: ['있음', '그대로.'] },
  { id: 'decode', name: '디코더', code: 'decode', now: ['일부', 'PCM 1~32ch(마스크 0은 직접 배치)와 DD+는 있습니다. JOC는 일부, MAT는 자리표시, TrueHD는 없습니다.'], after: ['계획', 'MAT 클린룸 디코더가 모든 확장의 선행 조건입니다.'] },

    <div class="panel"><${InletFigure}/></div>
    <div class="list">
      <div class="item"><b>둘째 엔드포인트</b><p>드라이버는 같은 형식 상위집합을 가진 HDMI 엔드포인트를 내고, 형식 규칙(코덱 마스크와 PCM 규칙)은 엔드포인트마다 둡니다. 처음 고친 판은 둘이었고, ADR 0028이 셋으로 늘렸습니다. 주 엔드포인트(0) Spatial SoftReceiver(공간 소프트리시버)와 음악 엔드포인트(1) Spatial SoftReceiver Music(공간 소프트리시버 음악)은 공유만 받고, 패스스루 엔드포인트(2) Spatial SoftReceiver PASS(공간 소프트리시버 PASS)는 독점만 받습니다. 어느 엔드포인트를 낼지는 ssr-setup이 쓰는 레지스트리의 엔드포인트 마스크로 정하고 기본은 셋 다 켬(0x7)입니다. 세 엔드포인트는 같은 가상 DMA 타이머와 트림을 쓰므로 같은 소스 클럭입니다.</p><p>링과 READ는 하나이고, 기록 머리의 reserved u32를 endpoint u16과 reserved u16으로 나눕니다. 배치가 그대로라 지금까지의 덤프와 SAL 어댑터의 기록은 엔드포인트 0으로 읽힙니다. 에포크와 누적 위치는 엔드포인트마다 세고, QUERY_INFO와 GET_STATS도 엔드포인트별 값을 돌려줍니다.</p><p>호환은 새 판독기가 옛 덤프(엔드포인트 0)를 읽는 방향만 보장합니다. 에포크 열쇠는 (endpoint, epoch)이고, 덤프 머리에 형식 판을 두어 판독기가 자기가 아는 판보다 새 덤프를 거절하게 합니다. 덤프 형식 2는 READ마다 끝 표식을 남겨, 재생기가 실시간과 같은 묶음으로 차선을 섞습니다. 형식 3은 볼륨 기록을 32채널로 늘렸습니다(ADR 0024, 0028).</p><p>엔진은 엔드포인트마다 차선을 두고, 차선마다 디코드, 갈래, 리샘플러, 지연을 따로 둡니다. 기준 차선은 없습니다(ADR 0028). 모든 차선이 함께 쓰는 48 kHz 시간선이 출력을 끌고 갑니다. 시간선은 받은 바이트로 나아가고, 살아 있는 차선이 없을 때만 QPC로 나아가(유휴 시계) 정지한 차선의 꼬리와 BRIR 잔향이 끝까지 나옵니다. 차선은 자기 객체를 출력 레이아웃의 방향(헤드폰은 BRIR 방향, 스피커는 스피커 배치)으로 패닝한 베드를 시간선에 놓고, 믹서는 차선의 베드를 더합니다. 그래서 객체 상한(64)은 차선 하나 안에서만 걸리고, 넘친 객체를 합치는 일은 없습니다. 늦은 차선의 빈자리만 무음이 되고, 버림과 언더런은 시간선 프레임마다 표시해 한 프레임을 한쪽으로만 셉니다. 차선의 장면은 44.1~192 kHz를 받고 유리수 다위상 리샘플러로 48 kHz에 맞춥니다(ADR 0024). 더한 베드는 출력단 하나로 가고, 트림은 출력단 뒤 교차 링 수위로 하나만 제어합니다.</p></div>
      <div class="item"><b>ASIO 입구는 JACK Router형</b><p>XT의 ASIO 조사는 처리 자리를 래퍼 안(A), 얇은 래퍼와 데몬(B), 데몬이 하드웨어를 쥐는 JACK형(C)으로 나누고 XT에는 B를 골랐습니다. Spatial SoftReceiver는 이미 DAC를 독점으로 쥔 렌더러(헤드폰 또는 스피커 출력)이므로 C가 맞습니다. ssrasio.dll은 하드웨어를 감싸지 않고 Spatial SoftReceiver로 들어가는 가상 장치입니다.</p></div>
      <div class="item"><b>DAC 클럭으로 끌어온다</b><p>깨우기 이벤트는 횟수를 세지 않으므로 생산량은 카운터로 주고받습니다. 출력 스레드는 DAC가 소비한 ASIO 프레임 누적값에 목표 선행량을 더한 demand를 올리고, DLL은 이미 요청했거나 실었거나 처리 중인 프레임을 뺀 부족분만큼 DAW 콜백을 부릅니다. DAC 주기 480 프레임에 ASIO 버퍼 64 프레임이면 한 주기에 평균 7.5번입니다.</p><p>Spatial SoftReceiver의 ASIO 처리 스레드가 렌더, 컨볼루션, 리미터를 거쳐 2채널 대기열에 넣고, 출력 스레드가 교차 링 출력과 더한 뒤 안전 리미터를 한 번 더 겁니다. 시작할 때는 선행량이 찰 때까지 ASIO 몫이 무음이고, DAC가 다시 시작하면 세대를 올려 지난 요청과 대기열을 버립니다. DAW가 DAC 속도로 불리므로 드리프트와 ASRC가 없습니다.</p><p>이 2채널 대기열은 헤드폰 출력을 전제로 합니다(ADR 0025). 스피커 출력(ADR 0030)에서 ASIO 입구를 어떻게 더할지는 아직 정하지 않았습니다.</p></div>
      <div class="item"><b>레이트, 버퍼, 채널</b><p>레이트는 DAC의 독점 레이트를 따르고, setSampleRate는 Spatial SoftReceiver에 DAC를 다시 열도록 요청합니다. 버퍼는 64~2048 프레임에서 고르고 차이는 대기열이 흡수합니다. 출력 채널은 Spatial SoftReceiver 설정의 ASIO 레이아웃(2.0, 5.1, 7.1, 7.1.4, 9.1.6)을 따르고, 표본 형식은 Float32LSB입니다. 입력 채널은 첫 판에 두지 않습니다.</p></div>
      <div class="item"><b>DAW 안에서 지킬 것</b><p>DAW는 장치 목록을 만들려고도 init을 부르므로 init은 가볍게 두고, Spatial SoftReceiver 기동과 준비 대기(5초), DAW 하나를 보장하는 클라이언트 임대는 createBuffers에서 합니다. 임대는 쥔 프로세스가 죽으면 Spatial SoftReceiver가 회수합니다.</p><p>Spatial SoftReceiver가 죽거나, 살아 있어도 demand가 일정 시간 나아가지 않으면 클럭 장애로 보고 QPC 대체 클럭으로 콜백을 계속 불러 DAW가 멈추지 않게 하며, kAsioResetRequest로 다시 열기를 요청합니다. 버퍼는 outputReady나 콜백 반환 때 정확히 한 번 확정하고, 시각 정보를 지원하는 DAW에는 bufferSwitchTimeInfo를 부릅니다. 패닉은 메서드마다 원래 반환형으로 바꾸고, 드라이버 항목 이름에는 'ASIO'를 넣지 않습니다(SDK 상표 규칙).</p></div>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>XT 래퍼 부품</th><th>Spatial SoftReceiver에서</th><th>무엇을</th></tr></thead>
      <tbody>${ported.map(([a, b, c]) => html`<tr key=${a}><td>${a}</td><td><${Chip} k=${pk[b]}>${b}<//></td><td>${c}</td></tr>`)}</tbody>
    </table></div>
    <div class="cols2">
      <div class="panel kv">
        <h3>라이선스 (정함)</h3>
        <p>XT 래퍼 코드는 모두 115dkk의 저작물이고 저작권자가 옮겨 쓰도록 허락했습니다. IASIO 인터페이스와 ASIO 타입은 Steinberg ASIO SDK에서 오고, SDK의 GPL 선택지를 씁니다.</p>
        <p>SDK에 닿는 부분에만, 되도록 좁게, SPDX로 GPL-3.0-or-later를 붙이고 나머지 파일은 MIT를 유지합니다. 릴리스하는 프로그램 전체는 GPL의 영향을 받습니다(2026-10-12 결정).</p>
        <p>고정한 SDK의 LICENSE.txt는 'GPL Version 3'만 적고 'or later'를 주지 않습니다. 그래서 SDK 정의를 손으로 옮긴 파일이 생기면 그 파일만 GPL-3.0-only이고, ssrasio.dll이 든 릴리스 전체는 GPLv3 조건입니다.</p>
      </div>
      <div class="panel kv">
        <h3>닿는 부분을 좁히는 방법</h3>
        <p>SDK 타입, 상수, IASIO vtable, COM 글루는 asio-sys 하나에만 두고, asio-sys는 Rust 타입의 트레이트만 내놓습니다. ssrasio.dll의 상태기계와 demand 계산은 그 트레이트를 구현하는 MIT 파일입니다.</p>
        <p>SDK 정의는 빌드 때 받은 헤더에서 만드는 쪽을 먼저 시도하고, SDK 파일은 저장소에 넣지 않습니다. 드라이버(MS-PL)는 별개 프로그램으로 함께 배포하고, streamring과 HostVST는 MIT 그대로 따로 낼 수 있습니다.</p>
      </div>
    </div>
  </section>`;
}

function LatencyFigure() {
  const x0 = 10, x1 = 350, max = 60;
  const X = v => x0 + (x1 - x0) * v / max;
  const rows = [
    { t: '구축기 이전', s: '브리지와 mpv를 거침, 숨은 125 ms 포함', over: true, val: '약 200 ms, 축 밖' },
    { t: '개선기 SAL 직결 엔진', s: 'MAT 디코드 완료 → DAC 재생, 실제 게임과 AVR', lo: 23, hi: 38, mid: 28, val: '23~38 ms, 평균 약 28' },
    { t: '개선기 체감 총지연', s: '인코더와 AVR 처리를 더한 추정', lo: 40, hi: 60, est: true, val: '40~60 ms 추정' },
    { t: 'Spatial SoftReceiver 러너 실측 (PR #7)', s: 'SAL READ → 재생 QPC, 합성 PCM, VB-CABLE', lo: 13.1, hi: 15.1, mid: 13.1, val: 'p50 13.1 · p99 15.1 ms' },
    { t: 'Spatial SoftReceiver 설계 예산', s: '반 버스트 + 교차 링 + 독점 버퍼, 계산값', lo: 0, hi: 23, est: true, val: '약 23 ms 계산' },
  ];
  const H = 58, top = 8, axisY = top + rows.length * H + 6;
  return html`<svg class="fig" viewBox=${'0 0 360 ' + (axisY + 26)} role="img" aria-label="지연 비교, 구간이 서로 다름">
    ${[0, 10, 20, 30, 40, 50, 60].map(v => html`<g key=${v}>
      <line x1=${X(v)} x2=${X(v)} y1=${top} y2=${axisY} style="stroke: var(--line); stroke-width: 1"/>
      <text class="lab" x=${X(v)} y=${axisY + 16} text-anchor=${v === 0 ? 'start' : v === 60 ? 'end' : 'middle'}>${v === 60 ? '60 ms' : v}</text>
    </g>`)}
    ${rows.map((r, i) => {
      const y = top + i * H;
      const by = y + 34;
      return html`<g key=${r.t}>
        <text class="bt" x=${x0} y=${y + 12}>${r.t}</text>
        <text class="bs" x=${x0} y=${y + 26}>${r.s}</text>
        <rect x=${x0} y=${by} width=${x1 - x0} height="10" rx="2" style="fill: var(--sunk)"/>
        ${r.over ? html`<g>
            <rect x=${x0} y=${by} width=${x1 - x0} height="10" rx="2" style="fill: var(--muted)"/>
            <path d=${`M${X(53)},${by - 3} l6,16 M${X(54.3)},${by - 3} l6,16`} style="stroke: var(--surface); stroke-width: 3"/>
          </g>`
          : html`<rect x=${X(r.lo)} y=${by} width=${Math.max(2, X(r.hi) - X(r.lo))} height="10" rx="2"
              style=${r.est ? 'fill: url(#hatch); stroke: var(--muted); stroke-width: 1' : 'fill: var(--accent)'}/>`}
        ${r.mid != null && html`<circle cx=${X(r.mid)} cy=${by + 5} r="4.2" style="fill: var(--ink); stroke: var(--surface); stroke-width: 1.5"/>`}
        <text class="lab" x=${x1} y=${y + 12} text-anchor="end">${r.val}</text>
      </g>`;
    })}
  </svg>`;
}

        <div><span>업믹스</span><span>분리 스템, α 0.80, 모델 이름 scnet_xl_ihf</span></div>
        <div><span>지연</span><span>엔진 8054.4 ms(코어 10.7 ms) + 장치 100 ms</span></div>
        <div><span>기타</span><span>클럭 드리프트 −25.3 ppm, 머리 추적 칸(예측 151 ms), CPU 평균 1.7%</span></div>
      </div>
    </div>
    <div class="panel"><${UpmixFigure}/></div>
    <div class="list">
      <div class="item"><b>초판에서 바꾼 것</b><p>초판은 C++ 라이브러리를 별도 프로세스로 붙이려 했습니다. 그러면 unsafe FFI와 라이선스 혼합은 피하지만, 저장소에 C++ 빌드가 들어오고 1만 줄을 우리가 고칠 수 없는 채로 들고 가야 합니다. 고친 판은 원본을 읽고 Rust로 다시 쓰므로 빌드는 cargo 하나로 끝나고 업믹서도 Linux CI에서 시험합니다.</p></div>
      <div class="item"><b>시작 조건은 라이선스</b><p>파생저작물이므로 원작자 저장소가 공개되고 그 라이선스가 허용해야 시작합니다. 라이선스가 없으면 ADR 0008 같은 동의를 따로 받습니다. 원본이 MIT, BSD, Apache 계열이면 우리 기여분은 MIT로 내되 원본의 고지, 라이선스 전문, 조건과 면책, NOTICE와 변경 고지를 그대로 지키고, GPL 계열이면 ADR 0003부터 고칩니다. 원본에 SAL 소스에서 온 부분이 있으면 그 부분은 읽지 않습니다(ADR 0005). 모델 가중치는 따로 봅니다. SCNet 코드는 MIT이지만 scnet_xl_ihf 가중치의 사용, 배포, 변환 조건은 확인하지 못했고, 확인 전에는 분리 경로를 기본값으로 켜지 않습니다.</p></div>
      <div class="item"><b>프로세스 안에서 도는 이유와 복구 범위</b><p>우리가 고치고 시험할 수 있는 코드이고, 프로세스를 넘는 블록 하나의 지연이 게임에는 비싸기 때문입니다. 손으로 쓴 unsafe가 없어 메모리를 깨뜨리지 않고, 흔한 실패는 되감기 패닉이라 잡힙니다. 분리 작업 스레드의 패닉은 그 스레드 경계에서, 캡처·DSP 스레드의 저지연 경로는 catch_unwind로 잡아 그 세션 동안 대체 신호로 고정하며 캡처는 계속합니다. abort, 스택 넘침, 할당 실패, 교착, 의존성 안의 unsafe 결함은 프로세스 안에서 복구하지 못하므로 그 대가로 받아들이고, 엔진이 멈추면 ssr-guard가 맡습니다.</p></div>
      <div class="item"><b>스레드 둘</b><p>분리 모델을 거치지 않는 저지연 경로는 캡처·DSP 스레드에서 블록마다 돕니다. 원본의 코어 10.7 ms를 이 경로로 읽었지만, 원본에 독립된 저지연 경로가 있는지는 저장소가 나와야 확인합니다. 분리 추론은 작업 스레드에서 돌고 미리 잡은 링으로 결과를 넘깁니다. 추론이 늦은 블록은 늘 함께 도는 저지연 경로의 출력으로 채우며 교차 페이드하고, 작업 스레드가 패닉하면 저지연 경로로 남은 채 supervisor가 작업 스레드를 다시 띄웁니다.</p></div>
      <div class="item"><b>unsafe는 upmix-sys에만</b><p>안전한 SIMD 감싸개와 순수 Rust 추론 크레이트(tract, burn, candle 등)로 먼저 재 봅니다. 벤치로 필요를 보인 PR에서만 upmix-sys를 만들고, upmix는 forbid를 유지합니다(ADR 0022). C++ 추론 런타임을 엔진 프로세스에 들이는 일은 이 결정의 범위 밖입니다.</p></div>
      <div class="item"><b>분리 경로는 둘째 엔드포인트에서만</b><p>한 엔드포인트의 소리는 한 믹스로 오므로 8초 지연은 알림음과 동영상 소리까지 늦춥니다(시스템 소리 절). 주 엔드포인트의 자동 갈래 선택은 저지연 경로만 고르고, 분리 경로는 사용자가 음악 앱을 보내는 둘째 엔드포인트(Spatial SoftReceiver Music, ADR 0024)에서만 켭니다. XTC와 BACCH는 업믹서의 일이 아니므로 옮기지 않습니다. 처음에는 ‘헤드폰 제품의 범위 밖’이라 적었지만 제품은 실제 스피커로도 출력하므로, XTC는 셋째 출력 종류로 나중에 따로 ADR에서 정합니다(ADR 0020의 2026-10-13 고침, ADR 0030).</p></div>
      <div class="item"><b>검증</b><p>원본 C++ 빌드를 블랙박스로 돌린 출력을 같은 입력의 허용 오차 골든으로 둡니다. 실시간 경로에는 assert_no_alloc 시험을 붙입니다.</p></div>
    </div>
  </section>`;
}

      <div class="item"><b>프로세스와 핸들</b><p>플러그인 하나에 호스트 하나입니다. 앱은 호스트를 Job 객체에 넣어 앱이 죽으면 호스트도 끝나게 하고(Job 핸들은 물려주지 않음), 오류 대화상자를 줄입니다. 공유 메모리와 이벤트는 이름 없는 객체로 만들어 그 핸들만 물려주고, 호스트를 다시 띄울 때마다 공유 메모리를 새로 만듭니다. 이것은 이름 선점과 핸들 유출을 막는 충돌 격리이지 보안 경계가 아니라서, 같은 사용자 권한의 악성 플러그인은 막지 못합니다. 편집기는 호스트의 최상위 창으로 띄우고, 플러그인 검사도 일회용 호스트에서 해 검사 중에 죽은 파일은 차단 목록에 올립니다.</p></div>
      <div class="item"><b>제어 채널</b><p>겹친 I/O를 쓰는 파이프입니다. 앱이 무작위 이름과 FILE_FLAG_FIRST_PIPE_INSTANCE로 서버 끝을 만들고 클라이언트 끝은 상속으로 넘깁니다. 익명 파이프는 겹친 I/O가 없어 상대가 멈추면 읽기와 쓰기가 막히기 때문입니다. 앱 쪽 읽기와 쓰기는 전용 I/O 스레드가 하고, 감시는 파이프를 기다리지 않는 별도 경로에서 합니다.</p><p>메시지는 <code>길이 u32 | 종류 u16 | 플래그 u16 | 요청 번호 u32 | 본문</code>이고, 모르는 종류는 건너뜁니다(ssr-abi 기록과 같은 원칙). 길이는 할당 전에 상한(상태 덩어리 64 MiB, 그 밖 64 KiB)과 비교합니다. Hello로 규약 버전을 맞추고, 앱은 Load, Configure(레이트, 최대 프레임, 버스 모양), Activate, SetState, GetState, OpenEditor, Shutdown을, 호스트는 Loaded(이름, 지연, 버스), LatencyChanged, State, ParamsChanged, Fault를 보냅니다.</p></div>

    <div class="list">
      <div class="item"><b>실시간 경로</b>
        <p>링은 XT의 StreamRing을 저작권자 허락으로 옮긴 streamring입니다. 블록마다 앱은 호스트가 순번 s−2를 끝냈을 때만 입력을 슬롯 s mod 2에 싣고 published를 올린 뒤 이벤트를 신호합니다. 끝내지 않았으면 그 슬롯을 호스트가 아직 읽고 있을 수 있으므로 구역을 건드리지 않고 그 블록을 누락으로 처리합니다. 블록 k에서 내보낼 출력은 블록 k−1의 것이고, 앱은 순번마다 실은 블록 번호와 구성 세대를 적어 둡니다. 블록 k−1이 실렸고 그 순번이 끝났으며 세대가 같을 때만 슬롯을 쓰고, 아니면 같은 시각의 대체 신호를 씁니다. 순번은 실린 블록에만 붙지만 출력 시간축은 누락 중에도 나아가므로, 순번만 보고 s−1을 읽으면 다른 시각의 블록을 낼 수 있어서입니다. 첫 블록과 다시 띄운 직후에는 이전 블록이 없으므로 대체 신호를 냅니다. 앱은 호스트를 기다리지 않습니다.</p>
        <p>호스트는 실린 순번을 건너뛰지 않고 차례로 제자리에서 처리합니다. 그래서 앱이 기다리지 않은 늦은 블록도 처리되어 플러그인 상태가 이어지고, 출력은 순번으로 확인되므로 묵은 슬롯을 다른 블록으로 읽는 일도, 읽는 동안 덮어쓰이는 일도 없습니다.</p>
        <p>공유 메모리는 Rust에서 원자 변수의 슬라이스로만 다룹니다. 다른 프로세스와 함께 쓰는 매핑에서 이것이 건전하려면 정렬, 매핑 수명, 같은 바이트를 다른 폭으로 섞어 접근하지 않음, 표본에 원자 연산으로만 접근함 같은 전제가 필요하고, 이 전제는 hostvst-sys의 안전성 문서에 적습니다. 호스트는 플러그인에 넘기기 전에 표본을 일반 f32 버퍼로 복사합니다. 링 알고리즘은 unsafe 없이 Linux에서, 매핑 구현은 Windows의 다중 프로세스 시험으로 검증합니다.</p>
      </div>
    </div>
    <div class="panel"><${FailFigure}/></div>
    <div class="list">
      <div class="item"><b>누락 블록과 지연</b><p>누락된 블록에는 플러그인 신호가 없으므로 같은 시각의 두 신호를 섞는 교차 페이드를 할 수 없습니다. 그래서 출력 앞에 2 ms를 붙잡아 두고, 누락을 알면 붙잡아 둔 직전 플러그인 출력의 끝 2 ms를 대체 신호로 페이드 아웃합니다. 플러그인 경로는 블록 하나(10 ms), 플러그인이 알린 지연(상한 2초), 이 2 ms만큼 늦고, 업믹스하지 않는 객체와 장면 메타데이터도 같은 만큼 늦춥니다. 게임에는 퍼스트파티 업믹서를 씁니다.</p></div>
      <div class="item"><b>지연이 바뀔 때</b><p>지연에는 구성 세대가 있습니다. VST 3의 kLatencyChanged나 VST 2의 audioMasterIOChanged가 오면 제어 스레드가 새 지연 맞춤 버퍼를 만들고, 단계는 정해진 블록 경계에서 새 버퍼로 바뀝니다. 그 사이에는 대체 신호를 쓰고 새 세대의 출력이 지연만큼 찬 뒤 돌아옵니다. 실시간 스레드는 할당하거나 해제하지 않습니다.</p></div>
      <div class="item"><b>상태 저장</b><p>죽은 뒤에는 상태를 가져올 수 없으므로 정상 실행 중에 미리 저장합니다(적재 직후, 편집기를 닫을 때, 파라미터가 마지막으로 바뀐 뒤 2초, 종료 직전). VST 3은 컴포넌트와 컨트롤러 상태를 따로 저장하고, VST 2는 청크를 지원하면 effGetChunk로, 아니면 프로그램 번호와 모든 파라미터 값을 저장합니다. 직전 상태 하나를 더 남겨, 복원한 상태로 다시 죽으면 그것으로 되돌립니다. 각 호출의 스레드 규칙은 구현 전에 SDK 문서로 확인합니다.</p></div>
    </div>
    <p class="note">호스트의 오디오 스레드는 이벤트를 100 ms 시한으로 기다리고 깨어날 때마다 heartbeat를 올리므로, 입력이 없을 때도 멈춤을 알아챕니다. 엔진과 드라이버는 이 과정에서 아무것도 기다리지 않아 캡처 링은 계속 비워지고 출력도 끊기지 않습니다.</p>

      <thead><tr><th>크레이트 (HostVST)</th><th>맡는 일</th><th>unsafe</th><th>Windows</th></tr></thead>

      <div class="panel kv">
        <h3>형식과 라이선스</h3>
        <p><b>VST 3:</b> SDK 3.8(2025-10)부터 MIT입니다. 바인딩은 SDK 헤더에서 생성한 vst3 크레이트(MIT 또는 Apache-2.0)를 씁니다.</p>
        <p><b>VST 2:</b> Steinberg SDK 대신 Xaymar의 클린룸 헤더(vst2sdk, BSD-2-Clause)를 Rust로 옮기고 BSD 고지를 남깁니다. EqualizerAPO-XT가 쓰는 것과 같은 헤더입니다.</p>
        <p>EqualizerAPO-XT의 호스팅 코드는 GPL이라 가져오지 않고, 그 저장소에서 겪은 일(DllMain 지연, 버스 모양 협상, 상태 덩어리 보관)만 요구로 받습니다.</p>
      </div>
      <div class="panel kv">
        <h3>HostVST로 내보내기</h3>
        <p>engine은 hostvst-proto만 의존하고, hostvst 계열은 ssr-* 크레이트에 의존하지 않습니다. 이것을 게이트로 검사하면 나중에 크레이트 셋을 그대로 떼어 낼 수 있습니다.</p>
        <p>2026-10-12에 crates.io에는 hostvst와 hostvst-sys가 없었고, 이미 있는 Rust 호스트 크레이트(rack)는 충돌 격리를 아직 로드맵에만 두고 있습니다.</p>
        <p>'VST'는 Steinberg의 상표이므로 이름을 쓰기 전에 Steinberg의 사용 지침을 확인합니다.</p>
      </div>
    </div>
  </section>`;

    </table></div>
    <div class="list">
      <div class="item"><b>Spatial SoftReceiver가 멈추면 모든 소리가 사라진다</b><p>모든 소리의 길이 Spatial SoftReceiver 하나이기 때문입니다. 정상 종료는 supervisor가 세 역할의 기본 장치를 되돌리고, 그 밖의 경우는 사용자 권한의 감시 프로세스 ssr-guard가 맡습니다. ssr-guard는 앱의 종료뿐 아니라 엔진의 진행도 봅니다. 출력 스레드는 입력이 없어도 독점 주기마다 무음을 쓰므로, 엔진이 올리는 출력·캡처 카운터가 2초 동안 그대로면 앱이 살아 있어도 고장으로 봅니다. 고장이면 앱을 한 번 다시 띄우고, 또 고장 나면 세션 시작 때 역할별로 적어 둔 장치로 되돌리되, 그 역할이 아직 Spatial SoftReceiver를 가리킬 때만 되돌려 사용자가 바꾼 설정을 덮어쓰지 않습니다. 플러그인을 프로세스 밖에 두는 것도 같은 이유입니다.</p></div>
      <div class="item"><b>믹스 전체에 같은 처리가 걸린다</b><p>드라이버는 어느 앱이 보낸 소리인지 모릅니다. 수 초 늦는 분리 업믹스를 걸면 알림음이 늦고 동영상은 입 모양과 어긋납니다. 그래서 둘째 엔드포인트를 두어(ADR 0024) 사용자가 음악 앱만 그쪽으로 보내게 하고, 분리 업믹스는 둘째 엔드포인트에서만 켭니다.</p></div>
