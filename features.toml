  "engine::output_open_failure_is_returned_from_start",
  "engine::capture_and_output_steady_state_do_not_allocate",
  "engine::format_seqlock_round_trips_formats",
]
note = "capture/DSP and output threads joined by a two-channel rtrb ring; lock-free control queues; retired BRIR sets are freed on the control thread. The output primes (silence until the ring holds target + one block + one period, then drops what lies beyond target + one block) at start, after an underrun and after a device restart"

[[feature]]
id = "engine.clock_asrc"
kind = "pipeline"
milestone = "M2"
status = "implemented"
tests = [
  "engine::asrc_converts_48_khz_to_44_1_khz_over_ten_seconds",
  "engine::clock_holds_the_trough_without_chasing_the_block_sawtooth",
  "engine::clock_follows_three_hundred_ppm_of_skew_for_asrc_and_trim",
  "engine::clock_with_a_period_as_long_as_a_block_stays_bounded",
  "engine::pi_controller_clamps_and_integrates",
]
note = "rubato Async sinc on the binaural pair. The PI controller holds the ring's trough (lowest level after a period, over 0.2 s windows) at target_ms, 60 ppm/ms and 3 ppm/(ms s), checked by a block-quantized simulation. When the device period equals the source block (shared mode with 10 ms PCM or MAT) the trough jumps by a block as the phase drifts and is held less tightly. On the dev PC a paced 48 kHz dump played 25 s through a TOPPING USB DAC (exclusive, 3 ms) with no underrun"

