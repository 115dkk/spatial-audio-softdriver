note = "driver/core owns the format rules (PCM candidates, sparse range bounds, subtype queries and concrete codec carriers) alongside the record ring, READ gate and DMA clock; no kernel API or allocation. The rules cover six rates, five shapes, all 18 speaker bits and direct out 1..32. driver/core/tests/core_tests.cpp tests them (PcmRules, PcmIntersectionOrder, PcmCandidateAgreementGrid, PcmMaskBits, CodecCarrierAcceptance, FormatSubtypeValidation, FormatTypeRules, PcmRangeRules and PcmIntersectionCandidates) under ASan and UBSan with clang, gcc and MSVC. New handles receive repeated known FormatChange and current StreamStart; every lost-record endpoint receives Overrun, repeated format, and repeated current Start/Stop before later records, with the next data discontinuous. An endpoint that never had a format keeps no format-repeat request, so overwriting it never makes PrepareRead fail or READ return nothing while records are queued (FormatlessOverwriteKeepsReading). The libFuzzer model reconstructs per-endpoint format, streaming and volume state solely from consumed records. driver.yml also sets SSR_DRIVER_CORE_DUMP so ssr-abi parses the stream and verifies reserved=0; partial until the kernel wrapper runs it on a test-signed PC"

[[feature]]
id = "driver.kernel"
kind = "driver"
milestone = "M3"
status = "partial"
tests = []
note = "spatialsoftreceiver.sys: SysVAD HDMI render x3 (EndpointMask=0x7; endpoint 2 is Spatial SoftReceiver PASS) and the \\\\.\\SpatialSoftReceiver control device; CodecMask0..3 compile 0x1fe and default to 0x6c (EAC3/EAC3 JOC/MAT20/MAT21); PcmRateMask/PcmShapeMask/PcmMaxMaskedChannels/PcmDirectChannels default to 0x3f/0x1f/18/0xffffffff. Format rules live in the core: the kernel adapts KS structures to FormatAccepted/FormatTypeAccepted and PcmRange, and derives codec entries from kCodecCarriers with WDK GUID assertions. PcmRules, PcmCandidateAgreementGrid, PcmMaskBits, CodecCarrierAcceptance, FormatSubtypeValidation, FormatTypeRules, PcmRangeRules and PcmIntersectionCandidates cover the rules; the coverage-instrumented format_fuzz target checks concrete acceptance against PCM rules and codec bits. Endpoint 0 requests shared float32 7.1 48 kHz and endpoints 1/2 float32 stereo 48 kHz through serialized VT_BLOB OEMFormat. Compile-checked on Linux (tools/kcheck.py). Windows gates in driver.yml build x64/ARM64 with /W4 /WX and code analysis, InfVerif and CodeQL, then install test-signed on windows-2022/windows-2025. All three endpoints, the exclusive policy, ring flow, volume, ssr-live end-to-end playback, the IOCTL fuzzer and restarts pass there on windows-2025; on windows-2022 an install under Driver Verifier's I/O verification (0x10) loses the runner for master's driver and this one alike (master's workflow never had Verifier on there) which is not this driver's: it happens only after a successful start, within seconds, whatever the endpoint count, dispatch interposition or power callbacks, and VB-CABLE, another root-enumerated PortCls audio driver installed the same way, loses the runner under the same I/O verification (ADR 0027); the 2022 gate leaves I/O verification out (0x9AB) and Server 2025's rule classes keep it. driver_flow_check.py now tests the default three-endpoint mask, and tools/ci/ioctl_fuzz.py attacks the control device (malformed lengths, fields, unknown codes, cancellation/close races, exclusive open, post-fuzz health) under Driver Verifier (tools/ci/verifier.ps1: volatile flags 0x9AB before the first load on Server 2022, i.e. the standard 0x9BB less I/O verification while the start under it is investigated, /dif rule classes on the running driver on Server 2025; a refused setting or an unlisted driver fails the job), then the device restarts five times; the faults job sweeps the driver's own Parameters\\FaultInjectAt switch (every resource acquisition of a clean load fails once, the device disabled and enabled for each; every unload must report zero outstanding pool blocks, timers and DMA pages in the volatile Diagnostics key, tools/ci/fault-sweep.ps1), then sweeps every fault point that two seconds of playback into all three endpoints with the ring read adds (streams, DMA buffers, timers, the control device; a run that does not finish in 120 s fails with its call number) and requires a clean playback afterwards, on both images. Verifier's volatile settings intercept nothing on Server 2022, /dif attaches only to the running image on Server 2025, and its systematic low-resources simulation failed none of 480 allocations there, so error branches rely on the switch and verifier.ps1 has no low-resources mode. Kernel resources are owned by the RAII types in ssr_kernel.h (C++23); IOCTL_SSR_READ allocates nothing (the one waiting READ uses a slot in the control state); opening a stream allocates only the stream and its DMA pages (WaveRT packets and notification events use fixed slots, because a failed event registration left the audio engine stalling its client). Exact OEM property placement, the DeviceFormat result, HVCI and JOC negotiation need a test-signed PC"

