note = "ADR 0001 (2026-10-15 addendum): Velopack installer and self-update. The app-installer job of release.yml packs the app, the guard, the setup tool and the test-signed driver package of the same release into Setup.exe (install under %LOCALAPPDATA%\\SpatialSoftReceiver, Start Menu shortcut with the app's AUMID). apps/spatial-softreceiver/src/update.rs reads releases.win.json from the GitHub releases (prereleases included), downloads an update and applies it on the user's restart (settings screen, after Quit) or at the next plain launch, never behind a running session; the uninstall hook gives the default roles back. Windows-only code with no Linux-testable part: the install, the shortcut AUMID, the uninstall hook and the update from one release to the next are checked on the test-signed PC (docs/testing/test-signed-pc.md). Partial until that check."
