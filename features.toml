# Feature registry (ADR 0002). A capability that is not listed here does not
# exist. The gates in crates/bio-policy fail when:
#   * an id repeats, or a kind or status is not one of the values below,
#   * a feature marked "implemented" lists no tests,
#   * a listed test ("crate-name::test_fn") does not exist in that crate.
# Marking a feature implemented without a verification test is a CI failure by
# design. Statuses: planned, partial, implemented.

