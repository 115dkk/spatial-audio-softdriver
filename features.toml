  "bio-abi::malformed_formats_are_errors",
]

[[feature]]
id = "abi.ioctl_codes"
kind = "abi"
milestone = "M0"
status = "implemented"
tests = ["bio-abi::ioctl_literals_match_ctl_code", "bio-abi::record_kinds_and_format_bits_are_distinct"]

[[feature]]
id = "abi.c_header"
kind = "abi"
milestone = "M0"
status = "implemented"
tests = ["bio-abi::c_header_matches_the_rust_layout"]
