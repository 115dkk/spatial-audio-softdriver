# ---- Real time (M2) ----

[[feature]]
id = "engine.realtime"
kind = "pipeline"
milestone = "M2"
status = "implemented"
tests = [
  "engine::format_and_needs_brir_events_reach_poll",
  "engine::prepared_swap_is_retired_through_poll",
