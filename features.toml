[[feature]]
id = "abi.dump_file"
kind = "abi"
milestone = "M0"
status = "implemented"
tests = ["bio-abi::header_round_trips_and_guards_the_magic"]

[[feature]]
id = "types.scene"
kind = "types"
milestone = "M0"
status = "implemented"
tests = [
  "bio-types::angles_follow_the_left_positive_convention",
  "bio-types::the_centre_has_no_direction",
  "bio-types::consistency_checks_every_signal_length",
]

[[feature]]
id = "types.layout_and_feeds"
kind = "types"
milestone = "M0"
status = "implemented"
tests = [
  "bio-types::layout_rejects_duplicates_empty_and_nan",
