note = "event-driven WAVEFORMATEXTENSIBLE output for 1..=32 channels (Float32, Int32, Int24in32, Int16), with exact masks for multichannel exclusive streams and shared autoconvert fallback; stereo retains its device-quirk negotiation. The stream starts on the first period and an exclusive stream restarts when its cadence stays slow: three waits in a row longer than two periods (at least 10 ms), not counting the first wait after a start, so a device start-up or one late wake under CPU load does not drop queued audio (stall_guard.rs, tested on every OS). Playback QPC strictly increases: the frame count predicts each period and an eighth of a clock reading's disagreement corrects it, so readings that move by whole periods (a shared virtual cable whose position updated every other period put two periods at one QPC) still space periods about one period apart, a device clock off nominal lags by a bounded amount instead of accumulating, and a reading more than four periods off (an underrun gap, a restart) or the first after an estimate is taken as is; estimates without a reading advance by at least one period. The calculation (playback_clock.rs) is frame-based, channel-independent and tested on every OS. Device enumeration reports shared mix formats and exact exclusive support for standard speaker layouts; ignored Windows tests probe VB-CABLE and verify allocation-free shared, exclusive-with-restart and multichannel periods; the CI live audio job runs them on the cable (the multichannel one takes the default endpoint's first exclusive layout wider than stereo)"

