# Feature registry (ADR 0002). A capability that is not listed here does not
# exist. The gates in crates/bio-policy fail when:
#   * an id repeats, or a kind or status is not one of the values below,
#   * a feature marked "implemented" lists no tests,
#   * a listed test ("crate-name::test_fn") does not exist in that crate.
# Marking a feature implemented without a verification test is a CI failure by
# design. Statuses: planned, partial, implemented.

# ---- Policy (M0) ----

[[feature]]
id = "policy.unsafe_forbid_everywhere"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = [
  "bio-policy::every_crate_root_forbids_unsafe",
  "bio-policy::budgeted_crates_carry_the_unsafe_lint_table",
  "bio-policy::no_unsafe_outside_budget",
  "bio-policy::budget_names_only_existing_crates",
  "bio-policy::unsafe_scanner_ignores_comments_strings_and_chars",
]

[[feature]]
id = "policy.feature_registry"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = [
  "bio-policy::features_registry_is_well_formed",
  "bio-policy::implemented_features_have_existing_tests",
]

[[feature]]
id = "policy.windows_code_stays_in_bio_sys"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = ["bio-policy::windows_code_stays_in_bio_sys"]
note = "only bio-sys names windows, windows-sys or wasapi; only apps other than bio-replay depend on bio-sys, so engine and everything below it build and test without Windows"

