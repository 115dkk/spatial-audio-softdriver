  "engine::eof_drain_sink_failure_returns_from_the_allocation_free_scope",
  "engine::declined_cadence_change_keeps_asrc_live_and_a_later_layout_tail_fresh",
  "engine::sustained_slow_cadence_grows_the_period_and_reopens_once",
]
note = "rubato Async sinc on the binaural pair. Auto chooses Trim only when the capture supports trim and the output is 48 kHz; otherwise it chooses ASRC at startup, and every output reopen (layout, loss or cadence) validates the opened format and reselects the mode, including 48 kHz Trim to 44.1 kHz ASRC; leaving Trim explicitly clears the capture source's requested correction. Forced Trim retries an incompatible reopened rate without counting a successful reopen, and stop interrupts that retry backoff. Non-loss layout and cadence reopens drain the old ASRC delay through the still-live sink before replacing the resampler, while actual device loss retains its discard policy. The end of capture is checked before every period, and again when the device asks for a period (also when the old layout ran out there), so a tail the resampler still holds after the last rendered period drains right after it (a reopen tail the end interrupts continues where it was; once everything is rendered a layout or cadence reopen gives way to finishing and a sinkless retry loop stops, and only a resampler that consumed input owes a tail). A period reads the end of capture once, before it looks at the ring, and the loop decides once after each period whether capture has ended; a short period at the end of the stream is not an underrun, fading back in after an underrun; the ratio stays fixed while a tail drains, and a cadence change the opener declines leaves the sink and resampler untouched. Source format changes never alter that choice or the fixed 48 kHz scene rate. The PI controller holds the ring's trough (lowest level after a period, over 0.2 s windows) at target_ms plus the smaller of the period's take and the delivery, which is what one delivery landing just after a take costs it. After priming it holds a reference that starts at the first window's trough and moves to the setpoint at 1 ms/s (1000 ppm, fed forward), the integral resting while it moves, and the reference moves to the lowest setpoint of the last second (a late double delivery raises it briefly, and a live target change is still followed while that flickers); every priming restarts the reference and the window it is measured over; so priming excess, a live target change and setpoint flicker are latency to move, never learned as skew. 60 ppm/ms and 3 ppm/(ms s), checked in release builds by driving the real crossing producer and output state (ring, priming, ASRC, controller) for minutes of audio, with the mixer's whole 480-frame blocks per capture step (E-AC-3 three or four at a time), audible priming excess, starting backlogs and blocks landing a period late; every scenario must complete most of its second-half windows with no ring overflow. The level is the frames the output has not taken yet, so markers a period already read do not count whole (they put the trough up to a period high and the CI soaks underran). The integral learns only within 12 ms of the setpoint and never further into a saturated output: priming keeps audible frames (ADR 0028), so a backlog or a refill after an underrun starts the trough tens of ms high, and integrating that latency as skew drained the ring dry every ~20 s in the CI soaks; 12 ms holds the one-block step a phase slip makes when the period is at least a block long, so the integral learns the skew from those slips. On the dev PC a paced 48 kHz dump played 25 s through a TOPPING USB DAC (exclusive, 3 ms) with no underrun"

