note = "capture/DSP and output threads joined by an output-width rtrb ring; lock-free control queues; retired BRIR sets are freed on the control thread. The output primes with exact-zero frames only and never discards a nonzero sample, and waits for target + the largest recent capture delivery (a whole DD+ sync frame arrives as several mixer blocks in one step) + one period; startup can install the first Prepared before capture begins. Full idle-silent blocks are omitted, while any other crossing overflow is counted exactly and reported as events: a burst's first block at once, then at most one event a second, then the rest when a block fits again, so a stalled output cannot flood the event queue. Lockstep tests use a virtual QPC rather than wall time. After warmup, allocation guards wrap each complete capture iteration (changes, trim, read, record processing, idle and EOF draining) and output iteration (fill, device period, period accounting, cadence and latency); reconnect waits, device opens, layout/format recovery and ASRC reconfiguration are structurally outside those scopes. Status carries four endpoint-local format/epoch/unsupported slots; each parsed format atomically publishes its support result independently of duplicate diagnostic suppression"

