  "ssr-types::snapshot_fixtures_match_the_types",
  "supervisor::every_fixture_sentence_is_the_supervisors",
]
note = "ADR 0001 (2026-10-15 addendum): apps/spatial-softreceiver is the Tauri 2 shell. A control thread (never the UI thread, so the Windows host can join the multithreaded apartment) owns the supervisor: it takes intents over a channel, polls every 33 ms, emits the `snapshot` event when the phase, an intent or a notice changes it (and every second when the output list differs), emits `meters` (EngineStatus) at the tick rate while Running, and persists supervisor::Settings as %LOCALAPPDATA%\\Spatial SoftReceiver\\settings.json after new and every successful intent. Two commands (dispatch, snapshot) and two events are the whole IPC; the TypeScript bindings (ui/src/bindings.ts) and the snapshot fixtures the screens are tested with are generated from ssr-types by tests/ui_contract.rs and compared in CI. The Windows launcher opens the driver ring and WASAPI (exclusive with shared fallback) with the profile resolved by the supervisor. Tray (open, enable/disable, quit), close to tray, single instance, autostart on login, and a --smoke mode the Windows CI runs (WebView2 draws the screens and asks for a snapshot). The screens (ui/, vitest + gallery screenshots) are the wizard, the status screen with 30 Hz meters, a profile screen, and settings. The installer and Velopack updates are app.installer; the Korean/English catalogues, the language contract and the settings screen's language selector are app.english. ADR 0033: an ordinary launch starts ssr-guard and exits; the guard launches the app with --guarded, and that app writes a one-line heartbeat (ssr_types::app::Heartbeat) to stdout every refresh; --resume (after the guard restarted it) enables once from Ready. At startup a restore point left by a previous instance is restored before the supervisor exists, and the guard's marker becomes a note on the first snapshot (Supervisor::note)"

