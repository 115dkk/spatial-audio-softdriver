note = "ADR 0031: the capture thread copies each complete E-AC-3 burst into one of 16 preallocated jobs (bitstream::MAX_PAYLOAD bytes each) and the ssr-decode thread runs the allocating upstream decoders; results come back through a second rtrb ring and are placed at the start of the next capture step, so the lane delay grows by one capture step. Reset jobs follow the bursts queued before them and are queued only for fronts that decoded since the last reset; a full queue refuses the burst with DecodeError::DecoderBehind (ChainErrorKind::DecoderBehind, counted as decode_refused). Each job carries the lane generation and the lane clock at submit: the chain discards a delivery from an earlier generation (a lane restart) or one later than MAX_DELAY_FRAMES of lane transport, counting its frames as dropped without an error event, so the mixer lane delay stays uncapped and a paused or zero-padded lane resumes from the frontier. A stop with deliveries in flight runs when the last one returns; a panic in the upstream decoder ends that job as a Corrupt error and the thread keeps running. Chains built by tests and offline tools keep the worker inline and run each job at the submit point, so offline rendering is unchanged; the runtime takes the worker with Chain::take_decode_worker"

