  "engine::the_end_of_capture_seen_after_the_last_take_drains_the_tail_right_after_it",
  "engine::an_underrun_before_the_end_of_capture_fades_the_tail_back_in",
  "engine::the_end_of_capture_seen_while_the_device_asks_for_a_period_puts_the_tail_in_it",
  "engine::the_end_of_capture_during_a_reopen_drain_writes_only_the_periods_left",
  "engine::a_stream_that_ends_before_any_audio_owes_no_tail_and_no_underrun",
  "engine::a_trim_stream_that_ends_inside_a_period_plays_its_last_frames_without_an_underrun",
  "engine::a_reopen_gives_way_to_finishing_once_everything_is_rendered",
