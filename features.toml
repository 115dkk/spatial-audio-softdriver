note = "ADR 0023 decision 4 as ADR 0033 reshaped it: ssr-guard (user rights, no unsafe) launches the app with its stdout piped and reads one heartbeat line per second (Running, output periods, capture reads; the engine counts both on the real-time threads with atomics). supervisor::guard decides: EOF with a restore point is an abnormal exit and restores; counters still, or no line, for 2 s while Running is a stall, which kills, restores, and relaunches the app once with --resume, and a second stall restores for good. Each restore leaves guard-restored.json, which the next app turns into a note. An app that holds the roles (its restore point exists) but sends no heartbeat for 15 s is killed and restored without a restart (marker reason stuck), and the control thread sends a not-Running heartbeat before working on a Quit so the quit's step is not a stall. A restore point names its owner (app_pid); the guard uses only one that is unowned or its own child's (a guard that launched nothing restores nothing), so a guard that outlived its app, or a second launch turned away by the single instance rule, never takes a running instance's roles. The control thread sends a not-Running heartbeat at start and before Disable or Quit, so neither step is a stall. One guard per state directory (guard.lock): a second launch's guard writes a show-window request the running app's shell takes once a second. driver.yml runs tools/ci/guard_check.py against a fake app (tools/ci/fake_app.py) for an exit, a stall with one restart, and a clean quit, checking the roles through ssr-live host show. Every marker write also attempts a WinRT toast with the same Korean sentence the next snapshot uses; toast errors are logged without changing recovery or the exit code. The shell registers HKCU display metadata without new unsafe; the installer must stamp the matching AUMID onto its Start menu shortcut. Linux tests cover XML escaping and all marker sentences; notification delivery needs a Windows desktop test"

