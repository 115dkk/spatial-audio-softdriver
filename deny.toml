# cargo-deny policy, checked by the `deny` job of ci.yml.

[graph]
all-features = true

[licenses]
# User mode ships under MIT (ADR 0003); dependencies must be compatible with
# redistributing the binaries under it. Copyleft licenses are not allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    # webpki-roots (velopack -> ureq -> rustls): Mozilla's root store, data under a permissive data license.
    "CDLA-Permissive-2.0",
    "MIT",
    "MIT-0",
    # The app's Tauri shell: cssparser, cssparser-macros, dtoa-short and
    # selectors (through dom_query, which tauri-utils and wry use) and
    # option-ext (through dirs-sys, which tauri uses). MPL-2.0's copyleft
    # covers only those crates' own files, which ship unmodified, so the
    # binaries can still go out under MIT.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false and inherit MIT from the workspace.
ignore = true

[advisories]
# A vulnerability is denied wherever it sits. Unmaintained crates are judged
# only where this workspace can act on them.
unmaintained = "workspace"
yanked = "deny"
# velopack-zip-guard: begin
# Three advisories on zip below 9.0.0 (RUSTSEC-2026-0367, -0368, -0369) are
# all in ZipArchive::extract and ZipStreamReader::extract, which velopack does
# not call: it reads entries with by_index and writes each file itself, so it
# creates no links and applies no permission bits. velopack, the updater,
# needs zip ^8.6 up to 1.2.161; upstream moved to zip 9 on develop on
# 2026-10-16, unreleased. The exception holds only while the newest velopack
# cannot be built with zip 9: .github/scripts/velopack_zip_guard.py proves it
# in ci.yml's cargo-deny job, and zip-advisory-guard.yml proves it every hour.
# The hour it fails, that workflow updates velopack, removes this block and
# the script, opens the pull request and disables itself.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "in ZipArchive::extract, which velopack does not call (velopack_zip_guard.py)" },
    { id = "RUSTSEC-2026-0368", reason = "in ZipArchive::extract, which velopack does not call (velopack_zip_guard.py)" },
    { id = "RUSTSEC-2026-0369", reason = "in ZipStreamReader::extract and ZipArchive::extract, which velopack does not call (velopack_zip_guard.py)" },
]
# velopack-zip-guard: end

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git sources are added one by one with the commit pinned in Cargo.toml.
allow-git = ["https://github.com/harletty/harletty-bridge"]
