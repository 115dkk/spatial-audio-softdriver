# cargo-deny policy, checked by the `deny` job of ci.yml.

[graph]
all-features = true

[licenses]
# User mode ships under MIT (ADR 0003); dependencies must be compatible with
# redistributing the binaries under it. Copyleft licenses are not allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false and inherit MIT from the workspace.
ignore = true

[advisories]
# A vulnerability is denied wherever it sits. Unmaintained crates are judged
# only where this workspace can act on them.
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git sources are added one by one with the commit pinned in Cargo.toml.
allow-git = ["https://github.com/harletty/harletty-bridge"]
